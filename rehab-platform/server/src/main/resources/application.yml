server:
  address: 127.0.0.1
  port: ${SERVER_PORT:8080}
spring:
  datasource:
    url: jdbc:h2:file:./data/rehab;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: local-demo-db
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
  jackson:
    time-zone: Asia/Shanghai
  web:
    resources:
      static-locations: classpath:/static/,file:../web/dist/
mybatis:
  configuration:
    map-underscore-to-camel-case: true
rehab:
  algorithm-url: ${ALGORITHM_URL:http://127.0.0.1:8001}
logging:
  level:
    root: INFO
